spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db?sslmode=require
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:changeme_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.vault.addr=${VAULT_ADDR:https://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}

app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.admin.default-username=${DEFAULT_ADMIN_USERNAME:admin}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:changeme_dev_only}
