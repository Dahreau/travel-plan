spring.application.name=travel-service
server.port=${SERVER_PORT:8083}

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/travel_db?sslmode=require
spring.datasource.username=${DB_USERNAME:travel_user}
spring.datasource.password=${DB_PASSWORD:changeme_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.neo4j.uri=${NEO4J_URI:bolt+ssc://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:changeme_dev_only}

app.vault.addr=${VAULT_ADDR:https://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}
app.vault.tls-cert-path=${VAULT_TLS_CERT_PATH:/etc/vault-tls/vault.crt}
