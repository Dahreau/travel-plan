# Actif uniquement quand SPRING_PROFILES_ACTIVE=docker (defini dans docker-compose.yml).
# Separer ces proprietes du fichier par defaut evite un piege documente de Spring Boot :
# un bundle SSL declare est valide au demarrage meme s'il n'est pas utilise, donc si ces
# lignes vivaient dans application.properties, `mvn test` planterait partout en cherchant
# un fichier de certificat qui n'existe que dans le conteneur Docker.
server.ssl.enabled=true
server.ssl.bundle=internal-services
spring.ssl.bundle.pem.internal-services.keystore.certificate=file:/etc/internal-tls/internal.crt
spring.ssl.bundle.pem.internal-services.keystore.private-key=file:/etc/internal-tls/internal.key
