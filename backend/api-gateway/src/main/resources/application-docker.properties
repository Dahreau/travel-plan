# Actif uniquement quand SPRING_PROFILES_ACTIVE=docker (defini dans docker-compose.yml).
# Meme raison que les 4 autres services : eviter qu'un bundle SSL declare fasse
# planter `mvn test` en cherchant un fichier qui n'existe que dans le conteneur.
#
# api-gateway a un double role ici : il presente ce certificat a Nginx (server.ssl,
# cote serveur) ET doit faire confiance a ce meme certificat pour appeler les 4
# microservices en HTTPS via le client RestClient sous-jacent au proxy `http()`
# de Spring Cloud Gateway Server MVC (cote client, spring.http.client.ssl.bundle).
# Reutiliser le meme certificat pour les deux roles simplifie la gestion : un seul
# fichier a generer et a faire confiance sur tout le maillage interne.
server.ssl.enabled=true
server.ssl.bundle=internal-services
spring.http.client.ssl.bundle=internal-services
spring.ssl.bundle.pem.internal-services.keystore.certificate=file:/etc/internal-tls/internal.crt
spring.ssl.bundle.pem.internal-services.keystore.private-key=file:/etc/internal-tls/internal.key
spring.ssl.bundle.pem.internal-services.truststore.certificate=file:/etc/internal-tls/internal.crt
