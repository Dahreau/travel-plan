spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

app.vault.addr=${VAULT_ADDR:https://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}
app.vault.tls-cert-path=${VAULT_TLS_CERT_PATH:/etc/vault-tls/vault.crt}

# 2 instances explicites par service : sans ca le client HTTP garde sa connexion keep-alive
# sur le premier replica resolu par le DNS Docker, et le load balancer n'a rien a repartir.
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=${AUTH_SERVICE_URI_1:http://localhost:8081}
spring.cloud.discovery.client.simple.instances.auth-service[1].uri=${AUTH_SERVICE_URI_2:http://localhost:8081}
spring.cloud.discovery.client.simple.instances.user-service[0].uri=${USER_SERVICE_URI_1:http://localhost:8082}
spring.cloud.discovery.client.simple.instances.user-service[1].uri=${USER_SERVICE_URI_2:http://localhost:8082}
spring.cloud.discovery.client.simple.instances.travel-service[0].uri=${TRAVEL_SERVICE_URI_1:http://localhost:8083}
spring.cloud.discovery.client.simple.instances.travel-service[1].uri=${TRAVEL_SERVICE_URI_2:http://localhost:8083}
spring.cloud.discovery.client.simple.instances.payment-service[0].uri=${PAYMENT_SERVICE_URI_1:http://localhost:8084}
spring.cloud.discovery.client.simple.instances.payment-service[1].uri=${PAYMENT_SERVICE_URI_2:http://localhost:8084}
