spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

app.vault.addr=${VAULT_ADDR:http://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}

spring.cloud.discovery.client.simple.instances.auth-service[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.discovery.client.simple.instances.user-service[0].uri=${USER_SERVICE_URI:http://localhost:8082}
