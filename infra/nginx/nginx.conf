server {
    listen 80;
    server_name _;

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/travel-plan.crt;
    ssl_certificate_key /etc/nginx/certs/travel-plan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # `resolver` + variable forcent une résolution DNS à chaque requête plutôt
    # qu'une seule fois au démarrage de nginx : sans ça, recréer `api-gateway`
    # ou `frontend` (nouveau déploiement, `docker compose up -d <service>`)
    # laisse ce nginx pointer vers l'ancienne IP tant qu'il n'est pas lui-même
    # redémarré. Avec `resolver`, chaque requête re-résout le nom au moment où
    # elle arrive — jamais besoin de relancer nginx après un déploiement d'un
    # autre service.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_gateway_upstream http://api-gateway:8080;
        proxy_pass $api_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
