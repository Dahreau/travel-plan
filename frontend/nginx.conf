server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques buildés par Angular (hash dans le nom -> cache long)
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy vers l'api-gateway : le navigateur ne voit qu'une seule
    # origine (celle de nginx), donc aucun CORS n'est nécessaire côté Java.
    #
    # Le nom "api-gateway" ne résout que si ce conteneur tourne sur le même
    # réseau Docker qu'un service de ce nom (pas encore le cas : ce conteneur
    # est aujourd'hui buildable/lançable seul, le câblage docker-compose
    # complet viendra plus tard). `resolver` + variable forcent une résolution
    # DNS paresseuse (à chaque requête) au lieu qu'nginx la fasse une seule
    # fois au démarrage — sans ça, nginx refuserait de démarrer tant que
    # "api-gateway" n'existe pas ("host not found in upstream").
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular : toute route inconnue retombe sur index.html (routing côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
