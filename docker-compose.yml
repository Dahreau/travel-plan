name: travel-plan-app

services:
  postgres:
    build: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 127.0.0.1 explicite (pas 0.0.0.0) : accessible depuis un client desktop local
      # (DBeaver) mais toujours injoignable depuis le reseau local/internet - conforme
      # a "accessible uniquement en interne", la machine hote fait partie de l'interne.
      # Port hote 5433 (pas 5432) : 5432 est deja pris par un autre process sur cette machine.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  neo4j:
    build: ./infra/neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: certificates/bolt
      NEO4J_dbms_ssl_policy_bolt_client__auth: "NONE"
      NEO4J_dbms_connector_bolt_tls__level: REQUIRED
    volumes:
      - neo4j_data:/data
    ports:
      # Meme principe que Postgres : lie sur 127.0.0.1 uniquement. 7474 = Neo4j Browser
      # (la vraie UI web, en HTTP clair - non concerne par le TLS active sur bolt), 7687 =
      # bolt (chiffre, self-signed - un client desktop devra accepter ce certificat).
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      # retries porte a 12 (~2 min de budget) : activer le SSL policy bolt (chargement du
      # certificat au demarrage) allonge le temps de boot au-dela des 50s precedentes,
      # ce qui faisait echouer "docker compose up" avant meme que le conteneur passe healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app

  vault:
    image: hashicorp/vault:2.0@sha256:db6a5f78749204d0a8d002be1cc6e9a2a6de53dffce41a894c4a06d309dca360
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_SKIP_VERIFY: "true"
    volumes:
      - vault_data:/vault/data
      - ./infra/vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./infra/vault/certs:/vault/tls:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  vault-init:
    image: hashicorp/vault:2.0@sha256:db6a5f78749204d0a8d002be1cc6e9a2a6de53dffce41a894c4a06d309dca360
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_SKIP_VERIFY: "true"
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    entrypoint: ["/bin/sh", "/vault-init/bootstrap.sh"]
    volumes:
      - ./infra/vault:/vault-init:ro
    restart: "no"
    networks:
      - app

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  auth-service:
    build: ./backend/auth-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${AUTH_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${AUTH_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-changeme_dev_only}
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./infra/internal-tls/certs:/etc/internal-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  user-service:
    build: ./backend/user-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${USER_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${USER_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./infra/internal-tls/certs:/etc/internal-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  travel-service:
    build: ./backend/travel-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: travel_user
      DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      NEO4J_URI: bolt+ssc://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${TRAVEL_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${TRAVEL_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./infra/internal-tls/certs:/etc/internal-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  payment-service:
    build: ./backend/payment-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${PAYMENT_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${PAYMENT_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./infra/internal-tls/certs:/etc/internal-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8084'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  api-gateway:
    build:
      context: ./backend/api-gateway
      additional_contexts:
        internal-tls-certs: ./infra/internal-tls/certs
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      vault-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      travel-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${API_GATEWAY_ROLE_ID}
      VAULT_SECRET_ID: ${API_GATEWAY_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_SERVICE_URI_1: https://travel-plan-app-auth-service-1:8081
      AUTH_SERVICE_URI_2: https://travel-plan-app-auth-service-2:8081
      USER_SERVICE_URI_1: https://travel-plan-app-user-service-1:8082
      USER_SERVICE_URI_2: https://travel-plan-app-user-service-2:8082
      TRAVEL_SERVICE_URI_1: https://travel-plan-app-travel-service-1:8083
      TRAVEL_SERVICE_URI_2: https://travel-plan-app-travel-service-2:8083
      PAYMENT_SERVICE_URI_1: https://travel-plan-app-payment-service-1:8084
      PAYMENT_SERVICE_URI_2: https://travel-plan-app-payment-service-2:8084
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./infra/internal-tls/certs:/etc/internal-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/internal-tls/certs/internal.crt:/etc/nginx/internal-certs/internal.crt:ro
    healthcheck:
      # 127.0.0.1 explicite : "localhost" resout en IPv6 (::1) en premier dans ce
      # conteneur, or nginx.conf n'ecoute qu'en IPv4 (`listen 80;` sans `[::]:80;`),
      # ce qui faisait echouer le healthcheck (connection refused) alors que nginx
      # fonctionnait normalement pour le trafic reel (ports publies, DNS Docker en A).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  postgres_data:
  neo4j_data:
  vault_data:

networks:
  app:
    driver: bridge
