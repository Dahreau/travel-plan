name: travel-plan-app

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  vault:
    image: hashicorp/vault:2.0@sha256:db6a5f78749204d0a8d002be1cc6e9a2a6de53dffce41a894c4a06d309dca360
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "${VAULT_HOST_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  vault-init:
    image: hashicorp/vault:2.0@sha256:db6a5f78749204d0a8d002be1cc6e9a2a6de53dffce41a894c4a06d309dca360
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    entrypoint: ["/bin/sh", "/vault-init/bootstrap.sh"]
    volumes:
      - ./infra/vault:/vault-init:ro
    restart: "no"
    networks:
      - app

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    ports:
      - "${ZIPKIN_HOST_PORT:-9411}:9411"
    networks:
      - app

  auth-service:
    build: ./backend/auth-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${AUTH_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${AUTH_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-changeme_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  user-service:
    build: ./backend/user-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${USER_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${USER_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  travel-service:
    build: ./backend/travel-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: travel_user
      DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${TRAVEL_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${TRAVEL_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  payment-service:
    build: ./backend/payment-service
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${PAYMENT_SERVICE_ROLE_ID}
      VAULT_SECRET_ID: ${PAYMENT_SERVICE_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8084'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  api-gateway:
    build: ./backend/api-gateway
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      vault-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      travel-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${API_GATEWAY_ROLE_ID}
      VAULT_SECRET_ID: ${API_GATEWAY_SECRET_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_SERVICE_URI: http://auth-service:8081
      USER_SERVICE_URI: http://user-service:8082
      TRAVEL_SERVICE_URI: http://travel-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - app

volumes:
  postgres_data:
  neo4j_data:

networks:
  app:
    driver: bridge
