---
- name: Fetch each service's Vault AppRole credentials and store them in .env
  hosts: travel_plan
  vars:
    project_dir: "{{ playbook_dir }}/../.."
    vault_addr: "http://localhost:8200"
    services:
      - api-gateway
      - auth-service
      - user-service
      - travel-service
      - payment-service

  tasks:
    - name: Read VAULT_DEV_ROOT_TOKEN from .env
      ansible.builtin.shell: |
        set -a
        . {{ project_dir }}/.env
        echo "$VAULT_DEV_ROOT_TOKEN"
      register: root_token_result
      changed_when: false

    - name: Fail early if the root token is empty
      ansible.builtin.fail:
        msg: "VAULT_DEV_ROOT_TOKEN is empty in .env — copy .env.example to .env and set it first."
      when: root_token_result.stdout | trim == ""

    - name: Set the root token as a fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ root_token_result.stdout | trim }}"

    - name: Wait for vault-init to have seeded the AppRole roles, then fetch role_id
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/{{ item }}/role-id"
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        method: GET
        status_code: 200
        return_content: true
      register: role_id_results
      until: role_id_results.status == 200
      retries: 10
      delay: 3
      loop: "{{ services }}"

    - name: Generate a fresh secret_id for each service
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/{{ item }}/secret-id"
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        method: POST
        status_code: 200
        return_content: true
      register: secret_id_results
      loop: "{{ services }}"

    - name: Write each service's role_id into .env (idempotent, updates the existing line)
      ansible.builtin.lineinfile:
        path: "{{ project_dir }}/.env"
        regexp: "^{{ item.item | upper | replace('-', '_') }}_ROLE_ID="
        line: "{{ item.item | upper | replace('-', '_') }}_ROLE_ID={{ (item.content | from_json).data.role_id }}"
      loop: "{{ role_id_results.results }}"
      no_log: true

    - name: Write each service's secret_id into .env (idempotent, updates the existing line)
      ansible.builtin.lineinfile:
        path: "{{ project_dir }}/.env"
        regexp: "^{{ item.item | upper | replace('-', '_') }}_SECRET_ID="
        line: "{{ item.item | upper | replace('-', '_') }}_SECRET_ID={{ (item.content | from_json).data.secret_id }}"
      loop: "{{ secret_id_results.results }}"
      no_log: true
