---
- name: Fetch each service's Vault AppRole credentials and store them in .env
  hosts: travel_plan
  vars:
    project_dir: "{{ playbook_dir }}/../.."
    services:
      - api-gateway
      - auth-service
      - user-service
      - travel-service
      - payment-service

  tasks:
    - name: Read VAULT_ROOT_TOKEN from .env
      ansible.builtin.shell: |
        set -a
        . {{ project_dir }}/.env
        echo "$VAULT_ROOT_TOKEN"
      register: root_token_result
      changed_when: false
      no_log: true

    - name: Fail early if the root token is empty
      ansible.builtin.fail:
        msg: "VAULT_ROOT_TOKEN is empty in .env — run vault-unseal.yml first (it initializes Vault and writes the real token here)."
      when: root_token_result.stdout | trim == ""

    - name: Set the root token as a fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ root_token_result.stdout | trim }}"
      no_log: true

    - name: Wait for vault-init to have seeded the AppRole roles, then fetch role_id
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - exec
          - -T
          - -e
          - "VAULT_TOKEN={{ vault_root_token }}"
          - vault
          - vault
          - read
          - -field=role_id
          - "auth/approle/role/{{ item }}/role-id"
      register: role_id_results
      until: role_id_results.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      loop: "{{ services }}"

    - name: Read each service's currently stored secret_id from .env, if any
      ansible.builtin.shell: |
        grep -m1 '^{{ item | upper | replace("-", "_") }}_SECRET_ID=' {{ project_dir }}/.env | cut -d= -f2- || true
      register: old_secret_id_results
      changed_when: false
      loop: "{{ services }}"

    - name: Revoke each service's previous secret_id before minting a new one (best-effort — an already-expired or malformed secret_id must not block the rotation)
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - exec
          - -T
          - -e
          - "VAULT_TOKEN={{ vault_root_token }}"
          - vault
          - vault
          - write
          - -f
          - "auth/approle/role/{{ item.item }}/secret-id/destroy"
          - "secret_id={{ item.stdout }}"
      loop: "{{ old_secret_id_results.results }}"
      when: item.stdout | trim != ""
      failed_when: false
      no_log: true

    - name: Generate a fresh secret_id for each service
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - exec
          - -T
          - -e
          - "VAULT_TOKEN={{ vault_root_token }}"
          - vault
          - vault
          - write
          - -f
          - -field=secret_id
          - "auth/approle/role/{{ item }}/secret-id"
      register: secret_id_results
      loop: "{{ services }}"
      no_log: true

    - name: Write each service's role_id into .env (idempotent, updates the existing line)
      ansible.builtin.lineinfile:
        path: "{{ project_dir }}/.env"
        regexp: "^{{ item.item | upper | replace('-', '_') }}_ROLE_ID="
        line: "{{ item.item | upper | replace('-', '_') }}_ROLE_ID={{ item.stdout | trim }}"
      loop: "{{ role_id_results.results }}"
      no_log: true

    - name: Write each service's secret_id into .env (idempotent, updates the existing line)
      ansible.builtin.lineinfile:
        path: "{{ project_dir }}/.env"
        regexp: "^{{ item.item | upper | replace('-', '_') }}_SECRET_ID="
        line: "{{ item.item | upper | replace('-', '_') }}_SECRET_ID={{ item.stdout | trim }}"
      loop: "{{ secret_id_results.results }}"
      no_log: true
