---
# Enchaîne les 3 playbooks dans le bon ordre. deploy.yml tourne deux fois :
# une première fois pour démarrer Vault (et laisser vault-init semer les
# rôles AppRole), puis fetch-vault-secrets.yml récupère les identifiants et
# les écrit dans .env, puis deploy.yml relance "docker compose up" — Docker
# Compose ne recrée alors que les conteneurs microservices dont les
# variables d'environnement ont changé (auth-service, user-service,
# travel-service, payment-service, api-gateway), qui démarrent cette fois
# avec de vrais identifiants Vault.
- import_playbook: install-docker.yml
- import_playbook: deploy.yml
  vars:
    tolerate_unhealthy_dependencies: true
- import_playbook: fetch-vault-secrets.yml
- import_playbook: deploy.yml
  vars:
    tolerate_unhealthy_dependencies: false
